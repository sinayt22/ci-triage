<!DOCTYPE html>
<meta charset="utf-8"/>
<title>CI Triage Labeler</title>
<style>
  :root {
    --bg:#1e1e1e; --panel:#252526; --rail:#1b1b1b; --border:#3c3c3c;
    --fg:#d4d4d4; --dim:#858585; --accent:#4ec9b0; --warn:#ce9178;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; height:100vh; background:var(--bg); color:var(--fg);
    font:13px/1.5 system-ui,sans-serif; display:grid;
    grid-template-rows:auto 1fr auto; overflow:hidden;
  }
  header,footer {
    padding:8px 14px; background:var(--panel); display:flex;
    gap:12px; align-items:center; flex-wrap:wrap;
  }
  header { border-bottom:1px solid var(--border); }
  footer { border-top:1px solid var(--border); }

  main { display:grid; grid-template-columns:210px 1fr 1fr; overflow:hidden; }
  #rail { background:var(--rail); border-right:1px solid var(--border); overflow-y:auto; }
  .col { overflow-y:auto; padding:12px; }
  .col + .col { border-left:1px solid var(--border); }

  .row {
    padding:6px 10px; cursor:pointer; border-bottom:1px solid #222;
    display:flex; gap:8px; align-items:baseline; font-size:12px;
  }
  .row:hover { background:#2a2d2e; }
  .row.sel { background:#04395e; }
  .row .n { color:var(--dim); min-width:22px; text-align:right; }
  .row .st { font-size:11px; color:var(--accent); }
  .row .st.none { color:#555; }

  h2 {
    font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--dim); margin:14px 0 5px;
  }
  h2:first-child { margin-top:0; }
  pre {
    background:#1a1a1a; border:1px solid var(--border); border-radius:4px;
    padding:9px; margin:0; white-space:pre-wrap; word-break:break-word;
    font:12px/1.45 ui-monospace,monospace; overflow:auto;
  }
  #log { max-height:none; }
  mark { background:#6b4a00; color:#fff; }
  details summary { cursor:pointer; color:var(--dim); margin:12px 0 4px; }

  button {
    background:#0e639c; color:#fff; border:0; border-radius:4px;
    padding:5px 10px; font:inherit; cursor:pointer;
  }
  button:hover { background:#1177bb; }
  button.ghost { background:transparent; border:1px solid var(--border); color:var(--fg); }
  .lbl { background:#3a3d41; }
  .lbl.on { background:var(--accent); color:#111; font-weight:600; }
  input,textarea {
    background:#1a1a1a; color:var(--fg); border:1px solid var(--border);
    border-radius:4px; padding:5px; font:inherit;
  }
  #notes { flex:1; min-width:200px; resize:vertical; }
  a { color:#4fc1ff; }
  .meta { display:flex; gap:12px; flex-wrap:wrap; color:var(--dim); font-size:12px; }
  .meta b { color:var(--fg); font-weight:500; }
  .hint { color:var(--warn); }

  #tax {
    position:fixed; right:0; top:0; bottom:0; width:min(560px,46vw);
    background:var(--panel); border-left:1px solid var(--border);
    padding:16px; overflow-y:auto; z-index:10; box-shadow:-8px 0 24px #0008;
  }
  #tax pre { white-space:pre-wrap; background:transparent; border:0; padding:0; font-size:12px; }
  #tax h3 { margin:0 0 10px; font-size:14px; color:var(--accent); }
  .taxnav { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:12px; }
  .taxnav button { font-size:11px; padding:3px 7px; }
</style>

<header>
  <button class="ghost" onclick="go(-1)">←</button>
  <span id="pos" style="min-width:64px"></span>
  <button class="ghost" onclick="go(1)">→</button>
  <button class="ghost" onclick="nextUnlabeled()">Next unlabeled (n)</button>
  <span id="progress" style="color:var(--dim)"></span>
  <input id="search" placeholder="/ search in log" oninput="renderLog()" style="flex:1;min-width:140px">
  <button class="ghost" onclick="toggleTax()">Taxonomy (t)</button>
</header>

<main>
  <div id="rail"></div>
  <div class="col" id="left"></div>
  <div class="col" id="right"></div>
</main>

<footer>
  <div id="labels" style="display:flex;gap:5px;flex-wrap:wrap"></div>
  <textarea id="notes" rows="1" placeholder="notes (required for 'unknown')"></textarea>
  <button class="ghost" onclick="clearLabel()">Unlabel</button>
  <span id="status" style="color:var(--dim);min-width:120px"></span>
</footer>

<div id="tax" hidden></div>

<script>
let CANDS = [], LABELED = {}, LABELS = [], TAX = {}, i = 0;

const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function boot() {
  const [cands, labels, labeled, tax] = await Promise.all([
    fetch('/api/candidates').then(r => r.json()),
    fetch('/api/labels').then(r => r.json()),
    fetch('/api/labeled').then(r => r.json()),
    fetch('/api/taxonomy').then(r => r.json()),
  ]);
  CANDS = cands; LABELS = labels; LABELED = labeled; TAX = tax;

  $('labels').innerHTML = LABELS.map((l, n) =>
    `<button class="lbl" data-label="${l}" onclick="setLabel('${l}')">${n+1} ${l}</button>`
  ).join('');

  renderRail();
  nextUnlabeled();
}

function renderRail() {
  $('rail').innerHTML = CANDS.map((c, n) => {
    const lab = LABELED[c.id]?.label;
    return `<div class="row ${n===i?'sel':''}" onclick="jump(${n})">
      <span class="n">${n+1}</span>
      <span class="st ${lab?'':'none'}">${lab ? esc(lab) : '—'}</span>
    </div>`;
  }).join('');
  $('rail').querySelector('.sel')?.scrollIntoView({block:'nearest'});
}

function renderLog() {
  const text = CANDS[i].log.excerpt || '(not provided)';
  let html = esc(text);
  const q = $('search').value.trim();
  if (q) {
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    html = html.replace(re, m => `<mark>${m}</mark>`);
  }
  $('left').innerHTML =
    `<h2>Log excerpt (${text.length.toLocaleString()} chars)</h2><pre id="log">${html}</pre>`;
}

function render() {
  const c = CANDS[i], saved = LABELED[c.id];

  $('pos').textContent = `${i+1} / ${CANDS.length}`;
  $('progress').textContent = `${Object.keys(LABELED).length} labeled`;

  renderLog();

  $('right').innerHTML = `
    <div class="meta">
      <span><b>${esc(c.repo)}</b></span>
      <span>job <b>${esc(c.job_name)}</b></span>
      <span>step <b>${esc(c.steps.failed_step_name)}</b></span>
      <span>event <b>${esc(c.run.event)}</b></span>
      <span>attempt <b>${c.run.run_attempt}</b></span>
      <span>branch <b>${esc(c.run.head_branch)}</b></span>
      <span><a href="${esc(c.run.run_url)}" target="_blank">run ↗</a></span>
    </div>
    ${c.triage.heuristic_hint ? `<h2>Heuristic hint (unverified)</h2>
      <div class="hint">${esc(c.triage.heuristic_hint)}</div>` : ''}
    <h2>Diff summary</h2>
    <pre>${esc(c.diff.summary) || '(not provided)'}</pre>
    <h2>Steps</h2>
    <pre>${c.steps.steps.map(s =>
      `${s.conclusion === 'failure' ? '✗' : '·'} ${esc(s.name)} — ${esc(s.conclusion)}`
    ).join('\n') || '(none)'}</pre>
    <details><summary>Workflow config</summary>
      <pre>${esc(c.workflow_config) || '(not provided)'}</pre></details>`;

  $('notes').value = saved?.notes ?? '';
  document.querySelectorAll('.lbl').forEach(b =>
    b.classList.toggle('on', b.dataset.label === saved?.label));
  $('status').textContent = saved ? `saved: ${saved.label}` : '';
  renderRail();
}

function jump(n) { i = n; render(); }
function go(d) { i = Math.max(0, Math.min(CANDS.length - 1, i + d)); render(); }

function nextUnlabeled() {
  let n = CANDS.findIndex((c, k) => k > i && !LABELED[c.id]);
  if (n < 0) n = CANDS.findIndex(c => !LABELED[c.id]);
  i = n < 0 ? i : n;
  render();
}

async function setLabel(label) {
  const c = CANDS[i], notes = $('notes').value;
  const res = await fetch('/api/label', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id: c.id, label, notes}),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    $('status').textContent = `error: ${JSON.stringify(err.detail ?? res.status)}`;
    return;
  }
  LABELED[c.id] = {label, notes};
  render();
  setTimeout(nextUnlabeled, 120);
}

async function clearLabel() {
  const c = CANDS[i];
  const res = await fetch(`/api/label/${encodeURIComponent(c.id)}`, {method: 'DELETE'});
  if (res.ok) { delete LABELED[c.id]; render(); }
}

function toggleTax(label) {
  const el = $('tax');
  if (!label && !el.hidden) { el.hidden = true; return; }
  const cur = label || LABELED[CANDS[i].id]?.label || LABELS[0];
  el.innerHTML = `
    <div class="taxnav">
      ${LABELS.map(l => `<button class="ghost" onclick="toggleTax('${l}')">${l}</button>`).join('')}
      <button class="ghost" onclick="$('tax').hidden=true">close</button>
    </div>
    <h3>${esc(cur)}</h3>
    <pre>${esc(TAX[cur] || '(no section in TAXONOMY.md)')}</pre>`;
  el.hidden = false;
  el.scrollTop = 0;
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (e.key >= '1' && e.key <= String(LABELS.length)) setLabel(LABELS[+e.key - 1]);
  else if (e.key === 'j' || e.key === 'ArrowDown') go(1);
  else if (e.key === 'k' || e.key === 'ArrowUp') go(-1);
  else if (e.key === 'n') nextUnlabeled();
  else if (e.key === 't') toggleTax();
  else if (e.key === 'Escape') $('tax').hidden = true;
  else if (e.key === '/') { e.preventDefault(); $('search').focus(); }
});

boot();
</script>
