[project]
name = "ci-triage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.121.0",
    "fastapi>=0.141.1",
    "google-genai>=2.17.0",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM"]
ignore = [
    "E501",     # line length - the formatter handles this
]